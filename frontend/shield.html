<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mouse AI Working</title>
  <!-- The "working" banner: a slim, always-on-top pill at the top of the screen while the
       agent drives the mouse and keyboard, so the user knows not to touch - and has Stop
       in reach. Plain static page (like overlay.html); excluded from screen capture so the
       agent's own screenshots never show it. -->
  <link rel="stylesheet" href="/shield.css" />
</head>
<body>
  <div id="bar" data-tauri-drag-region>
    <span class="bar-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4.5 11.2C4.5 6.9 7.9 3.5 12 3.5s7.5 3.4 7.5 7.7v7.6c0 .7-.8 1.1-1.3.6l-1.2-1a.8.8 0 0 0-1 0l-1.5 1.2a.8.8 0 0 1-1 0l-1.5-1.2a.8.8 0 0 0-1 0l-1.5 1.2a.8.8 0 0 1-1 0L7 18.4a.8.8 0 0 0-1 0l-.2.2c-.5.4-1.3.1-1.3-.6z"/><ellipse cx="9.7" cy="11" rx="1.15" ry="1.45" fill="#12223a"/><ellipse cx="14.3" cy="11" rx="1.15" ry="1.45" fill="#12223a"/></svg>
    </span>
    <span class="bar-text">
      <span id="bar-title">Mouse AI is working</span>
      <span id="bar-step">Starting…</span>
    </span>
    <span id="bar-pause" class="bar-note" hidden>Waiting for you to finish…</span>
    <button id="bar-stop" type="button" title="Stop the task (Esc)">Stop <kbd>Esc</kbd></button>
  </div>
  <script src="/shield.js"></script>
</body>
</html>
