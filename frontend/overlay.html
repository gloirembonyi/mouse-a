<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kudu Lens</title>
  <!-- Kept as a plain static page (not part of the React rewrite) - it's a
       small, already-working hover popup; ported verbatim from src/overlay.*
       as a second Vite entry point via public/overlay.css + public/overlay.js. -->
  <link rel="stylesheet" href="/overlay.css" />
</head>
<body>
  <div id="root">
    <button id="pill" hidden>
      <span class="pill-icon" aria-hidden="true">
        <!-- kudu-glyph:begin --><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="24" height="24" focusable="false" aria-hidden="true"><g class="tm-body"><g class="tm-head"><g class="tm-horns"><g class="tm-horn tm-horn-l"><path d="M43 36C41 29 32 27 32 19 32 12 41 12 39 5" style="fill:none;stroke:currentColor;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round"/></g><g class="tm-horn tm-horn-r"><path d="M57 36C59 29 68 27 68 19 68 12 59 12 61 5" style="fill:none;stroke:currentColor;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round"/></g></g><g class="tm-ear tm-ear-l"><path d="M34 46C22 42 8 30 11 16 22 15 36 27 38 44Z" style="fill:currentColor;"/></g><g class="tm-ear tm-ear-r"><path d="M66 46C78 42 92 30 89 16 78 15 64 27 62 44Z" style="fill:currentColor;"/></g><g class="tm-face"><path d="M30 44c0-8 9-13 20-13s20 5 20 13c0 12-6 26-10 36-3 8-6 13-10 13s-7-5-10-13C36 70 30 56 30 44z" style="fill:currentColor;"/></g><g class="tm-eyes-slot"><g class="tm-eyes" style="fill:#1d2440;stroke:none"><ellipse cx="38.5" cy="50" rx="5.08" ry="6.2"/><ellipse cx="61.5" cy="50" rx="5.08" ry="6.2"/></g></g><g class="tm-nose"><ellipse cx="50" cy="86" rx="4.2" ry="2.8" style="fill:#1d2440;opacity:1"/></g></g></g></svg><!-- kudu-glyph:end -->
      </span>
      <span class="pill-label">Ask Kudu</span>
      <span id="pill-context"></span>
      <span class="pill-kbd" aria-hidden="true">↵</span>
    </button>

    <div id="panel" hidden>
      <header id="panel-header" data-tauri-drag-region>
        <span class="panel-icon" aria-hidden="true">
          <!-- kudu-glyph:begin --><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="24" height="24" focusable="false" aria-hidden="true"><g class="tm-body"><g class="tm-head"><g class="tm-horns"><g class="tm-horn tm-horn-l"><path d="M43 36C41 29 32 27 32 19 32 12 41 12 39 5" style="fill:none;stroke:currentColor;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round"/></g><g class="tm-horn tm-horn-r"><path d="M57 36C59 29 68 27 68 19 68 12 59 12 61 5" style="fill:none;stroke:currentColor;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round"/></g></g><g class="tm-ear tm-ear-l"><path d="M34 46C22 42 8 30 11 16 22 15 36 27 38 44Z" style="fill:currentColor;"/></g><g class="tm-ear tm-ear-r"><path d="M66 46C78 42 92 30 89 16 78 15 64 27 62 44Z" style="fill:currentColor;"/></g><g class="tm-face"><path d="M30 44c0-8 9-13 20-13s20 5 20 13c0 12-6 26-10 36-3 8-6 13-10 13s-7-5-10-13C36 70 30 56 30 44z" style="fill:currentColor;"/></g><g class="tm-eyes-slot"><g class="tm-eyes" style="fill:#1d2440;stroke:none"><ellipse cx="38.5" cy="50" rx="5.08" ry="6.2"/><ellipse cx="61.5" cy="50" rx="5.08" ry="6.2"/></g></g><g class="tm-nose"><ellipse cx="50" cy="86" rx="4.2" ry="2.8" style="fill:#1d2440;opacity:1"/></g></g></g></svg><!-- kudu-glyph:end -->
        </span>
        <div class="panel-titles" data-tauri-drag-region>
          <span id="panel-app">Kudu</span>
          <span id="panel-element"></span>
        </div>
        <button id="btn-history" class="ghost-btn" title="Chat history" aria-label="Chat history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
        </button>
        <button id="btn-agent" class="ghost-btn" title="Agent mode: let Kudu act on your PC to do the task" aria-label="Agent mode">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5 13.9 8l5.6 1.9-5.6 1.9L12 17.5 10.1 11.8 4.5 9.9 10.1 8 12 2.5Z"/><path d="M19 14.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z"/></svg>
        </button>
        <button id="btn-open-app" class="ghost-btn" title="Open Kudu Desktop window" aria-label="Open main window">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-8 8"/><path d="M3 21l8-8"/></svg>
        </button>
        <button id="btn-close" class="ghost-btn" title="Close (Esc)" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </header>

      <!-- Prominent "AI is acting" banner, so the user knows not to grab the
           mouse/keyboard mid-run. The panel also gets an animated border. -->
      <div id="working-indicator" hidden>
        <span class="working-dot"></span>
        <span class="working-text">Kudu is working - please don't move the mouse or type</span>
      </div>

      <!-- Chat history browser (populated on demand from the backend). -->
      <div id="history-panel" hidden>
        <div class="history-head">
          <span>Recent chats</span>
          <button id="history-new" class="history-new" title="Start a new chat">＋ New</button>
        </div>
        <div id="history-list"></div>
      </div>

      <div id="answer" hidden></div>
      <div id="agent-log" hidden></div>

      <div id="thinking" hidden>
        <!-- overlay.js mounts a GhostOrb here; the dots stay as the fallback if the
             orb scripts are missing. -->
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="thinking-label">Looking at your screen…</span>
      </div>

      <!-- Pinned approval prompt - lives OUTSIDE the scrollable log so it's
           always fully visible the moment the agent needs a decision. -->
      <div id="confirm-host" hidden></div>

      <!-- First-turn shortcuts: gather what is on screen and shape it. -->
      <div id="quick-row" hidden></div>
      <!-- @-mention picker and the attached-context chips sit right above the input. -->
      <div id="mention-menu" hidden></div>
      <div id="chips" hidden></div>
      <div class="ask-row">
        <button id="btn-mention" title="Attach context: @screen, @window, @clipboard, @file, @web" aria-label="Attach context">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg>
        </button>
        <input id="question" type="text" placeholder="Ask anything or tell Kudu what to do…  @ to attach" autocomplete="off" spellcheck="false" />
        <button id="btn-analyze" title="Explain what's here" aria-label="Explain what's here">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button id="btn-ask" title="Ask / do it (Enter)" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
        </button>
      </div>

      <div id="resize-grip" title="Drag to resize"></div>
    </div>

    <div id="toast" hidden></div>
  </div>

  <!-- Same thinking orb as the browser extension. Vendored copies of
       stealth-ai-extension/shared/orb-engine.js and orb.js - regenerate the
       engine there with `npm run sync:orbs`, then copy both across. -->
  <script src="/orb-engine.js"></script>
  <script src="/orb.js"></script>
  <script src="/overlay.js"></script>
</body>
</html>
