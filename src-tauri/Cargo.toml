[package]
name = "mouse-ai-desktop"
version = "0.2.3"
description = "Kudu Desktop - the system-wide AI assistant by Kudu"
authors = ["Kudu"]
edition = "2021"

[lib]
name = "mouse_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
image = "0.25"
screenshots = "0.8"
chrono = "0.4"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
portable-pty = "0.9"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tauri-plugin-single-instance = "2"
# Meeting copilot audio: microphone + WASAPI loopback (system audio) capture.
cpal = "0.15"
# Editor document viewers: spreadsheets (xlsx/xls/ods) and the Office Open XML
# zips behind .docx/.pptx (same zip/quick-xml versions calamine already uses).
calamine = { version = "0.36", features = ["dates"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser", "wingdi", "windef", "processthreadsapi", "sysinfoapi",
    "psapi", "handleapi", "libloaderapi", "errhandlingapi"
] }
windows = { version = "0.61", features = [
    "Win32_Foundation", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Variant",
    "Win32_System_Ole", "Win32_UI_Shell"
] }

[target.'cfg(not(windows))'.dependencies]
# Mouse/keyboard synthesis on macOS (CGEvent) and Linux (X11). Windows keeps its own
# SendInput path in input.rs; this mirrors it so computer-use works on every OS.
enigo = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
