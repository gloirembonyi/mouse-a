[package]
name = "mouse-ai-desktop"
version = "0.1.0"
description = "Mouse AI — System-wide AI assistant powered by Thothai"
authors = ["Thothai"]
edition = "2021"

[lib]
name = "mouse_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
image = "0.25"
screenshots = "0.8"
chrono = "0.4"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser", "wingdi", "windef", "processthreadsapi",
    "psapi", "handleapi", "libloaderapi", "errhandlingapi"
] }
windows = { version = "0.61", features = [
    "Win32_Foundation", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Variant",
    "Win32_System_Ole", "Win32_UI_Shell"
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
