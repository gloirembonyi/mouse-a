name: Build Desktop App

# Every push and pull request builds the installers for Linux, macOS (universal)
# and Windows, so a change that only compiles on one OS is caught here, not by a
# user. Pushing a tag like v1.2.3 also publishes a draft GitHub release with all
# three sets of installers attached.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux
            args: ""
          - platform: macos-latest
            name: macos
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            name: windows
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system libraries (Tauri, tray, audio, X11 input)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev \
            libasound2-dev \
            libx11-dev libxtst-dev libxkbcommon-dev libxdo-dev xdotool

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies (Tauri CLI)
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # The unit tests drive PowerShell, UI Automation and Windows paths; on the
      # other runners the full build below is the compile check.
      - name: Rust unit tests
        if: matrix.name == 'windows'
        run: cargo test --lib
        working-directory: src-tauri

      - name: Build installers (${{ matrix.name }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Only a v* tag publishes; every other run just builds the bundles.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Mouse AI {0}', github.ref_name) || '' }}
          releaseBody: "Installers for Windows (.msi/.exe), macOS (.dmg, universal) and Linux (.deb/.rpm/.AppImage)."
          releaseDraft: true
          prerelease: false

      - name: Upload ${{ matrix.name }} installer(s)
        uses: actions/upload-artifact@v4
        with:
          name: mouse-ai-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 7
