name: Build Desktop App

# Every push and pull request builds the installers for Linux, macOS (universal) and
# Windows, so a change that only compiles on one OS is caught here, not by a user.
#
# A v* tag is a release: the three builds run, and only when ALL of them succeed the
# `release` job publishes one GitHub release with every installer attached and the
# notes generated from the commits since the previous tag. Nothing is published while
# a platform is still building, so a visitor never sees a half-filled release.
#
# How to cut a release: `npm run release -- 0.2.0` (bumps the version files, commits,
# tags v0.2.0 and pushes) or Actions -> "Release" -> Run workflow -> version.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux
            args: ""
          - platform: macos-latest
            name: macos
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            name: windows
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system libraries (Tauri, tray, audio, X11 input)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev \
            libasound2-dev \
            libx11-dev libxtst-dev libxkbcommon-dev libxdo-dev xdotool

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies (Tauri CLI)
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # The unit tests drive PowerShell, UI Automation and Windows paths; on the
      # other runners the full build below is the compile check.
      - name: Rust unit tests
        if: matrix.name == 'windows'
        run: cargo test --lib
        working-directory: src-tauri

      # On a tag the version files must agree with the tag, or users download a
      # v0.2.0 whose About screen says 0.1.0 and the updater can never reason about it.
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$conf" ]; then
            echo "::error::tag v$tag but src-tauri/tauri.conf.json says $conf - run 'npm run release -- $tag' instead of tagging by hand"
            exit 1
          fi

      - name: Build installers (${{ matrix.name }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload ${{ matrix.name }} installer(s)
        uses: actions/upload-artifact@v4
        with:
          name: mouse-ai-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    # Only a v* tag, and only after every platform built.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download every installer
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # The artifacts unpack with their bundle sub-folders (release/bundle/msi/...,
      # universal-apple-darwin/...); only the installer files themselves are attached.
      - name: Collect the installer files
        id: files
        run: |
          find installers -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) > files.txt
          echo "Attaching:"; cat files.txt
          if [ ! -s files.txt ]; then echo "::error::no installer files found in the artifacts"; exit 1; fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$TAG" in *-alpha*|*-beta*|*-rc*|*-pre*) prerelease="--prerelease" ;; esac
          # The notes: GitHub's generated list of commits/PRs since the previous tag,
          # under a fixed header that tells people which file to download.
          cat > notes.md <<'EOF'
          ## Downloads

          | Platform | File |
          |---|---|
          | Windows 10/11 | `Kudu Desktop_*_x64-setup.exe` (installer) or `Kudu Desktop_*_x64_en-US.msi` |
          | macOS 12+ (Apple Silicon and Intel) | `Kudu Desktop_*_universal.dmg` |
          | Linux (Debian/Ubuntu) | `Kudu Desktop_*_amd64.deb` |
          | Linux (Fedora/RHEL) | `Kudu Desktop-*.x86_64.rpm` |
          | Linux (any) | `Kudu Desktop_*_amd64.AppImage` |

          The installers are not code-signed yet: Windows SmartScreen shows "More info -> Run anyway"
          and macOS needs a right-click -> Open the first time.

          EOF
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$TAG" --jq .body >> notes.md || true
          mapfile -t files < files.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "Kudu Desktop $TAG" --notes-file notes.md --draft=false $prerelease
          else
            gh release create "$TAG" "${files[@]}" --title "Kudu Desktop $TAG" --notes-file notes.md $prerelease
          fi
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"

      # Optional public mirror. This repository is private, so its release assets
      # need a GitHub login to download. Set the repository variable RELEASES_REPO
      # (e.g. gloirembonyi/mouse-ai-releases, a public repo) and the secret
      # RELEASES_TOKEN (a fine-grained PAT with "Contents: write" on that repo) and the
      # same release is created there for the landing page's download link.
      - name: Mirror to the public releases repo
        if: vars.RELEASES_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ vars.RELEASES_REPO }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "::error::RELEASES_REPO is set but the RELEASES_TOKEN secret is missing"; exit 1; fi
          prerelease=""
          case "$TAG" in *-alpha*|*-beta*|*-rc*|*-pre*) prerelease="--prerelease" ;; esac
          mapfile -t files < files.txt
          if gh release view "$TAG" -R "$TARGET" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" -R "$TARGET" --clobber
            gh release edit "$TAG" -R "$TARGET" --title "Kudu Desktop $TAG" --notes-file notes.md --draft=false $prerelease
          else
            gh release create "$TAG" "${files[@]}" -R "$TARGET" --title "Kudu Desktop $TAG" --notes-file notes.md $prerelease
          fi
          echo "Mirrored to https://github.com/$TARGET/releases/tag/$TAG"
